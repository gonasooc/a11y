name: pages

# site/ 폴더를 그대로 GitHub Pages에 올린다. 빌드 도구는 쓰지 않는다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 바꾼다.
# (브랜치에서 바로 배포하는 방식은 루트나 /docs 폴더만 고를 수 있어 site/를 올리려면 이 워크플로가 필요하다.)
#
# 배포 전에 보고서의 생성 구역(표·차트 데이터)이 분석 출력과 같은지, 본문 숫자가 맞는지 검사한다.
# PR에서는 검사만 한다.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'analyses/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'analyses/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 외부 패키지가 없어 설치 단계가 없다.
      - run: node site/scripts/generate.mjs --check

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
